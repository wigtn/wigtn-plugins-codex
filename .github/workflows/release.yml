name: Release plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/wigtn-plugins-with-codex/.codex-plugin/plugin.json"
      - ".agents/plugins/marketplace.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release source
        run: ./scripts/validate.sh

      - name: Read plugin version
        id: version
        run: |
          version="$(python3 -c "import json; print(json.load(open('plugins/wigtn-plugins-with-codex/.codex-plugin/plugin.json'))['version'])")"
          test -n "$version"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create release when tag is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest
